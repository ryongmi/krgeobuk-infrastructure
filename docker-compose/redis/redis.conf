# Redis 설정 파일
# krgeobuk 프로젝트용

# 네트워크
bind 0.0.0.0
port 6379
protected-mode yes

# 보안
# requirepass는 docker-compose.yaml에서 설정

# 메모리 관리
maxmemory 256mb
maxmemory-policy allkeys-lru

# 데이터 지속성
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Append Only File (AOF)
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 로그
loglevel notice
logfile ""

# 데이터베이스 개수
databases 16

# 클라이언트
timeout 300
tcp-keepalive 300
maxclients 10000

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# 이벤트 알림 (키스페이스 이벤트)
notify-keyspace-events ""
